services:
  jenkins:
    image: jenkins/jenkins:${JENKINS_IMAGE_TAG:-2.568.2-jdk21}
    container_name: jenkins
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # JVM flags go in JAVA_OPTS (or JENKINS_JAVA_OPTS), NOT JENKINS_OPTS
      - JAVA_OPTS=${JENKINS_JAVA_OPTS:--Djava.awt.headless=true -Xmx2048m -Xms512m}
      # JENKINS_OPTS is for Jenkins CLI args only (e.g. --prefix, --httpPort)
      - JENKINS_OPTS=${JENKINS_OPTS:-}
      - TZ=${TZ:-Asia/Phnom_Penh}
    volumes:
      - jenkins_home:/var/jenkins_home
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - jenkins

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      jenkins:
        condition: service_healthy
    networks:
      - jenkins

volumes:
  jenkins_home:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  jenkins:
    driver: bridge
