services:
  jenkins:
    image: jenkins/jenkins:${JENKINS_IMAGE_TAG:-2.568.2-jdk21}
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      # Agent JNLP/TCP port (50000) is NOT exposed by default.
      # Recommended agent launch methods (SSH, WebSocket) do not require it.
      # To enable legacy JNLP/TCP agents, create a docker-compose.override.yml
      # (gitignored) with:
      #   services:
      #     jenkins:
      #       ports:
      #         - "${JENKINS_AGENT_PORT:-50000}:50000"
      # See docs/agents.md for details.
    environment:
      # JVM flags go in JAVA_OPTS (or JENKINS_JAVA_OPTS), NOT JENKINS_OPTS
      - JAVA_OPTS=${JENKINS_JAVA_OPTS:--Djava.awt.headless=true -Xmx2048m -Xms512m}
      # JENKINS_OPTS is for Jenkins CLI args only (e.g. --prefix, --httpPort)
      - JENKINS_OPTS=${JENKINS_OPTS:-}
      - TZ=${TZ:-Asia/Phnom_Penh}
    volumes:
      - jenkins_home:/var/jenkins_home
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - jenkins

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins:
    driver: bridge
